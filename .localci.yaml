steps:
  # Compile main + test sources and run every test of the module (JDK 11 toolchain). Test stdout
  # goes to surefire-reports/*-output.txt so the CI log stays under the agent's log cap.
  - name: icebergcatalog-test
    commands:
      - ./mvnw -o -B -ntp -Ddremio.no-ui -Ddremio.no-lint -Derrorprone.skip -Dmaven.gitcommitid.skip=true -Dmaven.test.redirectTestOutputToFile=true -pl plugins/icebergcatalog test
    timeout: 30m
    artifacts:
      - plugins/icebergcatalog/target/surefire-reports/*.xml
      - plugins/icebergcatalog/target/surefire-reports/*.txt
  # Compile and run every test of plugins/s3 (Dremio's S3 file system, changed in Phase 4 for
  # endpoints with a scheme). plugins/icebergcatalog uses it as a test-scope dependency resolved
  # from ~/.m2; this step tests the working tree's S3 code itself.
  - name: s3-test
    commands:
      - ./mvnw -o -B -ntp -Ddremio.no-ui -Ddremio.no-lint -Derrorprone.skip -Dmaven.gitcommitid.skip=true -Dmaven.test.redirectTestOutputToFile=true -pl plugins/s3 test
    timeout: 30m
    artifacts:
      - plugins/s3/target/surefire-reports/*.xml
      - plugins/s3/target/surefire-reports/*.txt
  # Same checks as `scripts/dev lint`: google-java-format, sortpom, license headers, checkstyle.
  - name: icebergcatalog-lint
    commands:
      - ./mvnw -o -B -ntp -Ddremio.no-ui -Dmaven.gitcommitid.skip=true -pl plugins/icebergcatalog,plugins/s3 spotless:check license:check checkstyle:check
    timeout: 15m
  # errorprone, forbiddenapis and enforcer, which the fast flags skip but upstream CI runs.
  # Falls back to online mode when the errorprone toolchain is not in ~/.m2 yet. The sources are
  # touched first: icebergcatalog-test already compiled them without errorprone, and an up-to-date
  # module would otherwise skip compilation (and errorprone) entirely.
  - name: icebergcatalog-static
    depends_on: [icebergcatalog-test, s3-test]
    commands:
      - find plugins/icebergcatalog/src plugins/s3/src -name '*.java' -exec touch {} +
      - ./mvnw -o -B -ntp -Ddremio.no-ui -Dmaven.gitcommitid.skip=true -DskipTests -pl plugins/s3,plugins/icebergcatalog verify || ./mvnw -B -ntp -Ddremio.no-ui -Dmaven.gitcommitid.skip=true -DskipTests -pl plugins/s3,plugins/icebergcatalog verify
    timeout: 30m
  # Mocha specs for the source forms. Reuses the dev checkout's installed node_modules
  # (DREMIO_NODE_MODULES) because the archive carries no node_modules, and the Node 22 + pnpm
  # that Maven installs for dac/ui (DREMIO_UI_NODE_DIR): Node 24 loads *.ts specs natively and
  # bypasses the Babel register hook.
  - name: ui-source-specs
    working_dir: dac/ui
    env:
      DREMIO_NODE_MODULES: /home/netbee/sharedisk/dev/workspace/dremio-oss/dac/ui/node_modules
      DREMIO_UI_NODE_DIR: /home/netbee/sharedisk/dev/workspace/dremio-oss/dac/ui/target/frontend/node
      UI_SPECS: >-
        src/pages/HomePage/components/modals/AddSourceModal/AddSourceModal-spec.js
        src/pages/HomePage/components/modals/AddSourceModal/SelectSourceType-spec.js
        src/pages/HomePage/components/modals/EditSourceView-spec.js
        src/utils/FormUtils/SourceFormJsonPolicy-spec.js
        src/utils/mappers/sourcesMapper-spec.js
        src/utils/sourceUtils-spec.ts
    commands:
      - test -d node_modules || ln -s "$DREMIO_NODE_MODULES" node_modules
      - export PATH="$DREMIO_UI_NODE_DIR:$PATH"; for s in $UI_SPECS; do DREMIO_UI_TESTS="$PWD/$s" pnpm run test:only || exit 1; done
      - export PATH="$DREMIO_UI_NODE_DIR:$PATH"; pnpm exec eslint src/constants/sourceTypes.js src/utils/sourceUtils.ts src/pages/HomePage/components/modals/AddSourceModal src/pages/HomePage/components/modals/EditSourceView.jsx
      - export PATH="$DREMIO_UI_NODE_DIR:$PATH"; pnpm exec prettier --check src/constants/sourceTypes.js src/utils/sourceUtils.ts src/utils/sourceUtils-spec.ts src/pages/HomePage/components/modals/AddSourceModal src/pages/HomePage/components/modals/EditSourceView.jsx
    timeout: 30m
  # Static checks of the Polaris E2E harness (scripts/polaris-e2e): shellcheck (local binary, or
  # the koalaman/shellcheck image) and the Apache license header of every script.
  - name: e2e-harness-lint
    working_dir: scripts/polaris-e2e
    commands:
      - 'for f in *.sh; do grep -q "Licensed under the Apache License, Version 2.0" "$f" || { echo "missing license header in $f"; exit 1; }; done'
      - 'if command -v shellcheck >/dev/null 2>&1; then shellcheck -x *.sh; else docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:stable -x *.sh; fi'
    timeout: 10m
