# AbleOps Local CI pipeline (http://localhost:8443/), see `localci submit --profile <name>`.
# Agents run on the dev host and resolve sibling modules from the baseline install in ~/.m2.
version: 1
pipeline:
  name: dremio-polaris-restcatalog
runner:
  concurrency: auto
default_profile: fast
profiles:
  fast:
    steps: [icebergcatalog-test, s3-test, icebergcatalog-lint]
  full:
    steps: [icebergcatalog-test, s3-test, icebergcatalog-lint, icebergcatalog-static, ui-source-specs, e2e-harness-lint]
# The server accepts at most 32 MiB / 10000 tar entries, and localci archives every
# directory (including ignored target/ trees). Steps build only plugins/icebergcatalog,
# plugins/s3 and dac/ui; other modules resolve from ~/.m2 and need only their pom.xml in the
# archive.
# Keep root src/: the root pom puts src/test/log-config (logback-test.xml) on the surefire
# classpath; without it tests log at DEBUG.
